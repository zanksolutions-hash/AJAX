<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurateur Ajax Systems</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0f11;
  --surface: #16181c;
  --surface2: #1e2126;
  --border: #2a2d35;
  --border2: #363a45;
  --accent: #e8ff47;
  --accent2: #47ffd4;
  --text: #f0f2f5;
  --muted: #6b7280;
  --muted2: #9ca3af;
  --red: #ff4757;
  --radius: 10px;
  --font-head: 'Syne', sans-serif;
  --font-mono: 'DM Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  min-height: 100vh;
  overflow-x: hidden;
}

.bg-grid {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.app {
  position: relative; z-index: 1;
  max-width: 780px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}

/* HEADER */
.header {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 2.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}
.header-logo {
  width: 42px; height: 42px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
}
.header-title {
  font-family: var(--font-head);
  font-size: 20px; font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--text);
}
.header-sub {
  font-size: 11px; color: var(--muted);
  margin-top: 2px; letter-spacing: .04em;
}

/* PROGRESS */
.progress-bar {
  display: flex; gap: 4px; margin-bottom: 2rem;
}
.prog-seg {
  flex: 1; height: 3px; border-radius: 99px;
  background: var(--border2);
  transition: background .3s;
}
.prog-seg.done { background: var(--accent); }
.prog-seg.active { background: var(--accent2); }

.step-label {
  font-size: 11px; color: var(--muted); margin-bottom: 1.5rem;
  letter-spacing: .06em; text-transform: uppercase;
}
.step-label span { color: var(--accent2); }

/* QUESTION */
.question-block {
  animation: fadeUp .25s ease both;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.q-number {
  font-size: 11px; color: var(--accent); letter-spacing: .1em;
  text-transform: uppercase; margin-bottom: 8px;
}
.q-title {
  font-family: var(--font-head);
  font-size: 22px; font-weight: 700;
  line-height: 1.25; margin-bottom: 6px;
  color: var(--text);
}
.q-hint {
  font-size: 12px; color: var(--muted2);
  margin-bottom: 1.5rem; line-height: 1.6;
}

/* OPTIONS */
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 2rem; }

.option {
  display: flex; align-items: flex-start; gap: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  text-align: left;
  width: 100%;
}
.option:hover { border-color: var(--border2); background: var(--surface2); }
.option.selected {
  border-color: var(--accent2);
  background: rgba(71,255,212,0.06);
}
.option.selected .opt-dot { background: var(--accent2); border-color: var(--accent2); }
.opt-dot {
  width: 18px; height: 18px; min-width: 18px;
  border-radius: 50%;
  border: 1.5px solid var(--border2);
  margin-top: 1px;
  transition: background .15s, border-color .15s;
}
.opt-body { flex: 1; }
.opt-label { font-size: 14px; font-weight: 500; color: var(--text); line-height: 1.3; }
.opt-sub { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.opt-badge {
  font-size: 10px; letter-spacing: .05em; padding: 2px 8px;
  border-radius: 99px; font-weight: 500; margin-top: 6px; display: inline-block;
}
.badge-green { background: rgba(71,255,212,0.12); color: var(--accent2); border: 1px solid rgba(71,255,212,0.25); }
.badge-yellow { background: rgba(232,255,71,0.12); color: var(--accent); border: 1px solid rgba(232,255,71,0.25); }
.badge-red { background: rgba(255,71,87,0.12); color: var(--red); border: 1px solid rgba(255,71,87,0.25); }

/* SUB-QUESTION */
.subq {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  margin-top: -4px;
  margin-bottom: 1rem;
  animation: fadeUp .2s ease both;
}
.subq-title { font-size: 13px; color: var(--muted2); margin-bottom: 10px; }
.subq-opts { display: flex; flex-wrap: wrap; gap: 8px; }
.subq-btn {
  font-family: var(--font-mono);
  font-size: 12px; padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  transition: border-color .12s, background .12s;
}
.subq-btn:hover { border-color: var(--accent2); }
.subq-btn.active { border-color: var(--accent2); background: rgba(71,255,212,0.08); color: var(--accent2); }

/* MULTI-SELECT hint */
.multi-hint { font-size: 11px; color: var(--muted); margin-bottom: 1rem; }

/* NAV */
.nav { display: flex; gap: 10px; }
.btn-next {
  flex: 1; padding: 14px;
  background: var(--accent);
  color: #0e0f11;
  border: none; border-radius: var(--radius);
  font-family: var(--font-head);
  font-size: 15px; font-weight: 700;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
  letter-spacing: .01em;
}
.btn-next:hover { opacity: .9; transform: translateY(-1px); }
.btn-next:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.btn-back {
  padding: 14px 18px;
  background: none;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--muted2);
  font-family: var(--font-mono);
  font-size: 13px;
  cursor: pointer;
  transition: border-color .12s, color .12s;
}
.btn-back:hover { border-color: var(--text); color: var(--text); }

/* RESULT */
.result-section { animation: fadeUp .3s ease both; }
.result-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--border);
}
.result-icon { font-size: 28px; }
.result-title {
  font-family: var(--font-head);
  font-size: 24px; font-weight: 800;
}
.result-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

.result-cat { margin-bottom: 1.5rem; }
.cat-title {
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 8px;
  display: flex; align-items: center; gap: 8px;
}
.cat-title::after { content:''; flex:1; height:1px; background:var(--border); }

.item-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.item-row:last-child { border-bottom: none; }
.item-qty {
  font-size: 11px; font-weight: 500;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: 3px 8px;
  color: var(--accent2);
  white-space: nowrap;
  min-width: 36px; text-align: center;
}
.item-info { flex: 1; }
.item-name { font-size: 13px; font-weight: 500; color: var(--text); }
.item-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
.item-price { font-size: 12px; color: var(--accent); white-space: nowrap; }

.total-bar {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  margin-top: 1.5rem;
}
.total-label { font-family: var(--font-head); font-size: 14px; font-weight: 700; }
.total-amount { font-family: var(--font-head); font-size: 22px; font-weight: 800; color: var(--accent); }
.total-sub { font-size: 10px; color: var(--muted); }

.btn-restart {
  width: 100%; margin-top: 1rem; padding: 13px;
  background: none;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--muted2);
  font-family: var(--font-mono);
  font-size: 13px; cursor: pointer;
  transition: border-color .12s, color .12s;
}
.btn-restart:hover { border-color: var(--text); color: var(--text); }

.warn-box {
  background: rgba(255,71,87,0.07);
  border: 1px solid rgba(255,71,87,0.25);
  border-radius: 8px; padding: 10px 14px;
  font-size: 12px; color: #ff8a94;
  margin-top: 8px; line-height: 1.5;
}
</style>
</head>

    return '<button class="option' + (sel ? ' selected' : '') + '" onclick="select(\'' + s.id + '\',\'' + o.value + '\',' + (s.type==='multi') + ')">' +
      '<div class="opt-dot"></div>' +
      '<div class="opt-body"><div class="opt-label">' + o.label + '</div>' +
      (o.sub ? '<div class="opt-sub">' + o.sub + '</div>' : '') +
      badge + '</div></button>';
  }).join('');

  var subqHtml = '';
  if (s.subq) {
    var modemAns = answers['modem_distance'];
    if (modemAns === 'proche') {
      var sq = s.subq.proche;
      var sqOpts = sq.options.map(function(o) {
        var a = answers[sq.id] === o.value;
        return '<button class="subq-btn' + (a ? ' active' : '') + '" onclick="answers[\'' + sq.id + '\']=\'' + o.value + '\';render()">' + o.label + '</button>';
      }).join('');
      subqHtml = '<div class="subq"><div class="subq-title">' + sq.title + '</div><div class="subq-opts">' + sqOpts + '</div></div>';
    }
  }

  var multiHint = s.type === 'multi' ? '<div class="multi-hint">Sélection multiple possible — cliquez sur toutes les options nécessaires</div>' : '';
  var canNext = canProceed(s);

  el.innerHTML =
    '<div class="progress-bar">' + prog + '</div>' +
    '<div class="step-label">Étape <span>' + (step+1) + ' / ' + STEPS.length + '</span></div>' +
    '<div class="question-block">' +
      '<div class="q-number">' + s.num + ' — ' + s.label + '</div>' +
      '<div class="q-title">' + s.title + '</div>' +
      (s.hint ? '<div class="q-hint">' + s.hint + '</div>' : '') +
      multiHint +
      '<div class="options">' + opts + '</div>' +
      subqHtml +
    '</div>' +
    '<div class="nav">' +
      (step > 0 ? '<button class="btn-back" onclick="goBack()">← Retour</button>' : '') +
      '<button class="btn-next" onclick="nextStep()" ' + (canNext ? '' : 'disabled') + '>' +
        (step === STEPS.length-1 ? 'Générer l\'inventaire →' : 'Suivant →') +
      '</button>' +
    '</div>';
}

function badgeLabel(b) {
  if (b==='badge-green') return 'Standard';
  if (b==='badge-yellow') return 'Avancé';
  if (b==='badge-red') return 'Pro / Certifié';
  return '';
}

function isSelected(id, val) {
  var a = answers[id];
  if (!a) return false;
  if (Array.isArray(a)) return a.indexOf(val) >= 0;
  return a === val;
}

function select(id, val, multi) {
  if (multi) {
    if (!answers[id]) answers[id] = [];
    var idx = answers[id].indexOf(val);
    if (idx >= 0) answers[id].splice(idx, 1);
    else answers[id].push(val);
  } else {
    answers[id] = val;
  }
  render();
}

function canProceed(s) {
  var a = answers[s.id];
  if (!a || (Array.isArray(a) && a.length === 0)) return false;
  if (s.subq && answers['modem_distance'] === 'proche' && !answers['batterie']) return false;
  return true;
}

function nextStep() { step++; render(); }
function goBack() { step--; render(); }

function buildInventory() {
  var items = [];
  function add(key, qty) {
    if (PRODUCTS[key]) items.push({ key: key, qty: qty || 1 });
  }

  // Q1 — Hub
  var dist = answers['modem_distance'];
  if (dist === 'proche') {
    if (answers['batterie'] === 'oui') add('hub_bp');
    else add('hub_2_4g');
  } else {
    if (answers['batterie'] === 'oui') add('hub_bp');
    else add('hub_2_plus');
  }

  // Q2 — Ouverture
  var ouv = answers['ouverture'] || [];
  if (ouv.indexOf('doorprotect') >= 0) add('doorprotect');
  if (ouv.indexOf('doorprotect_plus') >= 0) add('doorprotect_plus');

  // Q3 — Mouvement
  var mouv = answers['mouvement'] || [];
  mouv.forEach(function(v) { add(v); });

  // Q4 — Sirènes
  var sir = answers['sirenes'] || [];
  sir.forEach(function(v) { add(v); });

  // Q5 — Claviers
  var clav = answers['claviers'] || [];
  clav.forEach(function(v) { add(v); });
  if (clav.indexOf('keypad_plus') >= 0) add('pass');

  // Q6 — Incendie
  var inc = answers['incendie'] || [];
  inc.forEach(function(v) { add(v); });

  // Q7 — Inondation
  var inond = answers['inondation'];
  if (inond === 'leaks') add('leaks');
  if (inond === 'leaks_stop') { add('leaks'); add('waterstop'); }

  // Q8 — Télésurveillance
  var tel = answers['telesurveillance'];
  if (tel === 'audio' || tel === 'both') add('speakerphone');

  return items;
}

function buildResult() {
  var items = buildInventory();

  var cats = [
    { label: 'Centrale', keys: ['hub_bp','hub_2_4g','hub_2_plus'] },
    { label: 'Détecteurs d\'ouverture', keys: ['doorprotect','doorprotect_plus'] },
    { label: 'Détecteurs de mouvement', keys: ['motionprotect','motionprotect_plus','motioncam','motioncam_phod','motioncam_hd','combiprotect','outdoor','curtain','curtaincam'] },
    { label: 'Sirènes', keys: ['homesiren','streetsiren','doubledeck','nfa2p'] },
    { label: 'Claviers & contrôle', keys: ['spacecontrol','keypad','keypad_plus','keypad_outdoor','button','doorbell','pass'] },
    { label: 'Détection incendie', keys: ['fp2_hs','fp2_hco','fp2_hsco','fp2_h','fp2_co'] },
    { label: 'Protection inondation', keys: ['leaks','waterstop'] },
    { label: 'Levée de doute audio', keys: ['speakerphone'] },
  ];

  var total = 0;
  var html = '';

  cats.forEach(function(cat) {
    var catItems = items.filter(function(i) { return cat.keys.indexOf(i.key) >= 0; });
    if (!catItems.length) return;
    html += '<div class="result-cat"><div class="cat-title">' + cat.label + '</div>';
    catItems.forEach(function(i) {
      var p = PRODUCTS[i.key];
      var lineTotal = p.price * i.qty;
      total += lineTotal;
      html += '<div class="item-row">' +
        '<div class="item-qty">×' + i.qty + '</div>' +
        '<div class="item-info"><div class="item-name">' + p.name + '</div><div class="item-desc">' + p.desc + '</div></div>' +
        '<div class="item-price">' + lineTotal.toLocaleString('fr-FR') + ' €</div>' +
      '</div>';
    });
    html += '</div>';
  });

  var warnAnimal = answers['mouvement'] && answers['mouvement'].indexOf('motionprotect') >= 0;

  return '<div class="result-section">' +
    '<div class="result-header">' +
      '<div class="result-icon">📋</div>' +
      '<div><div class="result-title">Inventaire matériel Ajax</div>' +
      '<div class="result-sub">Gamme Jeweller sans fil — prix indicatifs HTVA</div></div>' +
    '</div>' +
    html +
    '<div class="total-bar">' +
      '<div><div class="total-label">Total estimé</div><div class="total-sub">HTVA — hors installation</div></div>' +
      '<div class="total-amount">' + total.toLocaleString('fr-FR') + ' €</div>' +
    '</div>' +
    (warnAnimal ? '<div class="warn-box">⚠️ MotionProtect standard sélectionné : vérifiez le poids des animaux. Si > 20 kg, remplacer par MotionProtect Plus.</div>' : '') +
    '<button class="btn-restart" onclick="restart()">↺ Nouvelle configuration</button>' +
  '</div>';
}

function restart() {
  step = 0; answers = {};
  render();
}

render();
</script>
</body>
</html>
